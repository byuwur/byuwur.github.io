name: Publish versioned releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== BUILD RELEASE ARTIFACTS =====
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: byuwur.github.io
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: byuwur.github.io
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render the portfolio shell and home content
        run: |
          php home.php > "$RUNNER_TEMP/portfolio-home.html"
          php main.php > "$RUNNER_TEMP/portfolio-main.html"
          grep -Fq 'id="spa-content"' "$RUNNER_TEMP/portfolio-home.html"
          grep -Fq 'id="resume"' "$RUNNER_TEMP/portfolio-main.html"
      - name: Validate exact tag, main ancestry, and release ownership
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs --check
      - name: Build release preview or tagged distributions
        run: node .github/scripts/release.mjs
      - name: Test generated release
        timeout-minutes: 5
        run: node --test .github/tests/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release
          path: byuwur.github.io/dist/assets/
          if-no-files-found: error
          retention-days: 7

  # ===== PUBLISH THE RELEASE =====
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tested-release
          path: dist/assets/
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs --publish
