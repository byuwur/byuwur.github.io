<html lang="en">
  <meta charset="UTF-8" />

  <body style="overflow: hidden">
    <div class="card" style="font-family: Bahnschrift; overflow: hidden; transform-origin: top left; scale: 0.6; height: 12.5rem; width: 25rem; background: #fff; border: 0; margin: 0">
      <div class="top" style="height: 50%; background: #123; transition: all 0.3s ease-in-out">
        <div class="image" style="display: inline-block; background: #234; padding: 0.25rem; border: 0.25rem solid #fff; position: relative; margin: 1rem 0 0 40%; transition: all 0.3s ease-in-out">
          <img style="width: 4.5rem; height: 4.5rem" src="https://byuwur.github.io/img/logo.png" />
        </div>
      </div>
      <div class="info" style="margin: 1.25rem 0; text-align: center; transition: all 0.3s ease-in-out">
        <div style="font-size: 2rem">Andres Trujillo Mateus</div>
        <div style="width: 50%; margin: 0 25% 0.5rem 25%; height: 0.0625rem; background: #000"></div>
        <div>software dev. && video editor</div>
      </div>
      <div class="contact" style="margin: 0.75rem 0 0 1.25rem; font-size: 1.625rem; line-height: 1.25rem; transition: all 0.3s ease-in-out">
        <div style="margin-left: 2.5rem">
          <img src="https://byuwur.github.io/img/icons/card-blue.png" style="height: 1rem; width: 1.75rem; display: inline-block; object-fit: contain" />
          <span style="position: relative; bottom: 0.25rem">[Mateus] byUwUr</span>
        </div>
        <div style="margin-left: 2.5rem">
          <img src="https://byuwur.github.io/img/icons/globe-blue.png" style="height: 1rem; width: 1.75rem; display: inline-block; object-fit: contain" />
          <a href="https://byuwur.github.io" target="_blank" style="color: #007; position: relative; bottom: 0.25rem">[byuwur.github.io]</a>
        </div>
        <div>
          <img src="https://byuwur.github.io/img/icons/linkedin-blue.png" style="height: 1.25rem; width: 1.75rem; display: inline-block; object-fit: contain" />
          <a href="https://linkedin.com/in/atrujillomateus" target="_blank" style="color: #007; position: relative; bottom: 0.25rem">atrujillomateus</a>
        </div>
        <div>
          <img src="https://byuwur.github.io/img/icons/github-blue.png" style="height: 1.25rem; width: 1.75rem; display: inline-block; object-fit: contain" />
          <a href="https://github.com/byuwur" target="_blank" style="color: #007; position: relative; bottom: 0.25rem">@byuwur</a>
        </div>
      </div>
    </div>
    <style>
      .card:hover .info {
        transform: translateY(250%);
      }
      .card:hover .top {
        height: 12.5% !important;
      }
      .card:hover .contact {
        transform: translateY(-57.5%);
      }
      .card:hover .image {
        margin-left: 2.5% !important;
      }
    </style>
  </body>
</html>
